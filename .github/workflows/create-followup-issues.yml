name: Create implementation issues from PR changes

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  pull-requests: read

jobs:
  create-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Create issues for changed files
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES_TOKEN: ${{ secrets.CROSS_REPO_ISSUES_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPOSITORY: ${{ github.repository }}
          FRONT_REPOSITORY: marunaka610/pitagora-game-front
          INFRA_REPOSITORY: marunaka610/pitagora-game-infra
        run: |
          gh api --paginate --jq '.[] | @base64' \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
            > "$RUNNER_TEMP/changed-files.txt"

          export GH_TOKEN="$ISSUES_TOKEN"

          while IFS= read -r encoded_file; do
            file=$(printf '%s' "$encoded_file" | base64 --decode)
            filename=$(jq -r '.filename' <<< "$file")

            case "$filename" in
              docs/*)
                continue
                ;;
              content/*)
                target_repo=$FRONT_REPOSITORY
                ;;
              .github/*|requirements.txt|zensical.toml)
                target_repo=$INFRA_REPOSITORY
                ;;
              *)
                continue
                ;;
            esac

            body=$(cat <<EOF
          This follow-up issue was generated from PR #$PR_NUMBER: $PR_TITLE

          Review the changes to \`$filename\` and create or update the implementation tasks needed to reflect them.

          Source: $PR_URL
          EOF
          )

            gh issue create \
              --repo "$target_repo" \
              --title "Follow-up: $filename (PR #$PR_NUMBER)" \
              --body "$body"
          done < "$RUNNER_TEMP/changed-files.txt"
